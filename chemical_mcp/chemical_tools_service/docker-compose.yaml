services:
  chemical-service:
    build: .
    container_name: 'chemical-service'
    ports:
     - "8000:80"
    volumes:
     - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  retrosynthesis-api:
    container_name: 'retrosynthesis-api'
    build:
      context: ./retrosynthesis
      dockerfile: Dockerfile
    env_file:
      - ./retrosynthesis/.env-non-dev
    restart: unless-stopped
    network_mode: host
